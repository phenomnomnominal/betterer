name: 'build'
on:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'

jobs:
  build:
    runs-on: ${{ matrix['operating-system'] }}

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        operating-system: [windows-latest, macOS-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use node.js ${{ matrix['node-version'] }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix['node-version'] }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build:ci

      - name: Coverage
        run: cat ./reports/unit-coverage/coverage-summary.md >> $GITHUB_STEP_SUMMARY

  affected:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - uses: nrwl/nx-set-shas@v4

      - name: Lint and typecheck affected projects
        run: npx nx affected -t lint typecheck
